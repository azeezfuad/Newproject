name: Secret Practice Pipeline

on:
  workflow_dispatch:

jobs:
  secret-demo:
    name: Secret Demo
    runs-on: ubuntu-latest

    steps:
      - name: Check secret safely
        run: |
          if [ -z "${{ secrets.FAKE_API_TOKEN }}" ]; then
            echo "Secret is missing"
            exit 1
          else
            echo "Secret is configured"
          fi

      - name: Show GitHub masking
        run: echo "Secret value is ${{ secrets.FAKE_API_TOKEN }}"