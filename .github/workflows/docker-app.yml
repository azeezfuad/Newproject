name: Docker App Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  checkout:
    name: 01 - Checkout Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List repository files
        run: ls -la

      - name: Print repository variable
        run: echo "App environment is ${{ vars.APP_ENV }}"

  docker-verify:
    name: 02 - Verify Docker
    runs-on: ubuntu-latest
    needs: checkout

    steps:
      - name: Show Docker version
        run: docker --version

  build-image:
    name: 03 - Build Docker Image
    runs-on: ubuntu-latest
    needs: docker-verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ vars.IMAGE_NAME }}:${{ github.sha }} .

  run-container:
    name: 04 - Run Docker Container
    runs-on: ubuntu-latest
    needs: build-image

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image again
        run: docker build -t ${{ vars.IMAGE_NAME }}:${{ github.sha }} .

      - name: Run Docker container
        run: docker run --rm ${{ vars.IMAGE_NAME }}:${{ github.sha }}

  upload-report:
    name: 05 - Upload Build Report
    runs-on: ubuntu-latest
    needs: run-container

    steps:
      - name: Create build report
        run: |
          echo "Docker App Pipeline Report" > build-report.txt
          echo "App environment: ${{ vars.APP_ENV }}" >> build-report.txt
          echo "App name: ${{ vars.APP_NAME }}" >> build-report.txt
          echo "Image name: ${{ vars.IMAGE_NAME }}" >> build-report.txt
          echo "Image tag: ${{ github.sha }}" >> build-report.txt
          echo "Docker Hub user: ${{ vars.DOCKERHUB_USERNAME }}" >> build-report.txt
          echo "Status: Docker image built and container ran successfully" >> build-report.txt

      - name: Upload build report artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-report
          path: build-report.txt

  dockerhub-push:
    name: 06 - Push Docker Image to Docker Hub
    runs-on: ubuntu-latest
    needs: upload-report

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image with commit tag
        run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}
        