name: Docker App Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  checkout:
    name: 01 - Checkout Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List repository files
        run: ls -la

      - name: Print repository variable
        run: echo "App environment is ${{ vars.APP_ENV }}"

  docker-verify:
    name: 02 - Verify Docker
    runs-on: ubuntu-latest
    needs: checkout

    steps:
      - name: Show Docker version
        run: docker --version

  build-image:
    name: 03 - Build Docker Image
    runs-on: ubuntu-latest
    needs: docker-verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ vars.IMAGE_NAME }}:${{ github.sha }} .

  run-container:
    name: 04 - Run Docker Container
    runs-on: ubuntu-latest
    needs: build-image

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image again
        run: docker build -t ${{ vars.IMAGE_NAME }}:${{ github.sha }} .

      - name: Run Docker container in background
        run: docker run -d --name docker-app-test -p 8080:8080 ${{ vars.IMAGE_NAME }}:${{ github.sha }}

      - name: Test app response
        run: |
          sleep 5
          curl --fail http://localhost:8080

      - name: Stop Docker container
        if: always()
        run: docker stop docker-app-test || true

  scan-image:
    name: 05 - Scan Docker Image with Trivy
    runs-on: ubuntu-latest
    needs: run-container

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image for scanning
        run: docker build -t ${{ vars.IMAGE_NAME }}:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ vars.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 0
          format: table

  upload-report:
    name: 06 - Upload Build Report
    runs-on: ubuntu-latest
    needs: scan-image

    steps:
      - name: Create build report
        run: |
          echo "Docker App Pipeline Report" > build-report.txt
          echo "App environment: ${{ vars.APP_ENV }}" >> build-report.txt
          echo "App name: ${{ vars.APP_NAME }}" >> build-report.txt
          echo "Image name: ${{ vars.IMAGE_NAME }}" >> build-report.txt
          echo "Image tag: ${{ github.sha }}" >> build-report.txt
          echo "Docker Hub user: ${{ vars.DOCKERHUB_USERNAME }}" >> build-report.txt
          echo "Security scan: Trivy scan completed" >> build-report.txt
          echo "Status: Docker image built, tested, scanned, and container ran successfully" >> build-report.txt

      - name: Upload build report artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-report
          path: build-report.txt

  dockerhub-push:
    name: 07 - Push Docker Image to Docker Hub
    runs-on: ubuntu-latest
    needs: upload-report

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image with commit and latest tags
        run: |
          docker build \
            -t ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:latest \
            .

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:latest