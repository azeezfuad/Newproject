name: Pull Request Check Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  pr-check:
    name: PR Docker Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show branch information
        run: |
          echo "Pull request branch: ${{ github.head_ref }}"
          echo "Target branch: ${{ github.base_ref }}"

      - name: Build Docker image
        run: docker build -t pr-check:latest .

      - name: Run Docker container in background
        run: docker run -d --name pr-check-app -p 8080:8080 pr-check:latest

      - name: Test app response
        run: curl http://localhost:8080

      - name: Stop Docker container
        if: always()
        run: docker stop pr-check-app