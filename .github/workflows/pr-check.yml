name: Pull Request Check Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  pr-check:
    name: PR Docker Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -L -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate Kubernetes manifests
        run: kubeconform -strict -summary k8s/

      - name: Show branch information
        run: |
          echo "Pull request branch: ${{ github.head_ref }}"
          echo "Target branch: ${{ github.base_ref }}"

      - name: Build Docker image
        run: docker build -t pr-check:latest .

      - name: Run Docker container in background
        run: docker run -d --name pr-check-app -p 8080:8080 pr-check:latest

      - name: Test app response
        run: |
          sleep 5
          curl --fail http://localhost:8080

      - name: Stop Docker container
        if: always()
        run: docker stop pr-check-app || true